<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absensi Organisasi (Native Scanner)</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background: #f4f4f4; margin: 0; }
        #video-preview { width: 100%; max-width: 500px; background: #000; border-radius: 8px; transform: scaleX(-1); /* Efek cermin saat pakai kamera depan, akan otomatis mati di kamera belakang */ }
        .container { margin-top: 20px; background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        button { padding: 12px 20px; font-size: 16px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 5px; margin: 5px; width: 45%; font-weight: bold;}
        .btn-danger { background: #dc3545; }
        .btn-success { background: #28a745; width: 90%; margin-top: 10px;}
        #result-list { text-align: left; max-height: 250px; overflow-y: auto; border-top: 1px solid #ddd; padding-top: 10px; margin-top: 15px; }
        .log-item { border-bottom: 1px solid #eee; padding: 8px 0; font-size: 14px; }
        #status-teks { font-size: 14px; color: #666; margin-bottom: 10px; }
    </style>
</head>
<body>

    <h2>Absensi QR/Barcode</h2>
    
    <!-- Area Video dari Kamera HP -->
    <video id="video-preview" autoplay playsinline></video>
    <div id="status-teks">Kamera belum menyala</div>
    
    <div class="container">
        <!-- Tombol Kontrol -->
        <button onclick="mulaiKamera()">Nyalakan Kamera</button>
        <button onclick="stopKamera()" class="btn-danger">Matikan Kamera</button>
        <br>
        <button onclick="exportToCSV()" class="btn-success">⬇️ Download Data (CSV)</button>
        <button onclick="clearData()" class="btn-danger" style="width: 90%; margin-top: 10px;">🗑️ Hapus Semua Riwayat</button>
        
        <h3 style="text-align: left; margin-bottom: 5px;">Riwayat Absen:</h3>
        <div id="result-list"></div>
    </div>

    <script>
        // --- 1. INISIALISASI DATABASE LOKAL ---
        let attendanceData = JSON.parse(localStorage.getItem('absensi_anggota')) || [];
        const video = document.getElementById('video-preview');
        const statusTeks = document.getElementById('status-teks');
        
        let isScanning = false;
        let lastScanned = ""; // Mencegah barcode disinggung 2 kali berturut-turut
        let streamValid = null;

        function updateUI() {
            const list = document.getElementById('result-list');
            list.innerHTML = '';
            // Tampilkan dari yang paling baru (di reverse)
            [...attendanceData].reverse().forEach((item, index) => {
                list.innerHTML += `<div class="log-item"><b>${item.id}</b> <br><small style="color:#888;">${item.waktu}</small></div>`;
            });
        }

        // --- 2. FUNGSI MENYALAKAN KAMERA ---
        async function mulaiKamera() {
            // Cek apakah browser HP mendukung fitur Native Barcode
            if (!("BarcodeDetector" in window)) {
                alert("Browser HP Anda tidak mendukung pemindai tanpa internet ini. Pastikan Anda menggunakan Google Chrome versi terbaru di Android.");
                return;
            }

            try {
                // Meminta akses kamera belakang HP
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment" } 
                });
                
                // Jika pakai kamera belakang, matikan efek cermin
                video.style.transform = "scaleX(1)";
                video.srcObject = stream;
                streamValid = stream;
                
                video.play();
                isScanning = true;
                statusTeks.innerHTML = "✅ Kamera aktif. Arahkan ke Barcode/QR.";
                statusTeks.style.color = "green";
                
                // Mulai deteksi barcode secara berulang
                scanBerulang();

            } catch (err) {
                alert("Gagal mengakses kamera. Pastikan Anda memberikan izin akses kamera.");
                console.error(err);
            }
        }

        function stopKamera() {
            if (streamValid) {
                streamValid.getTracks().forEach(track => track.stop());
                video.srcObject = null;
                isScanning = false;
                statusTeks.innerHTML = "Kamera dimatikan.";
                statusTeks.style.color = "#666";
            }
        }

        // --- 3. FUNGSI PEMINDAI UTAMA ---
        async function scanBerulang() {
            if (!isScanning) return;

            // Membaca format QR Code dan Barcode pada umumnya
            const barcodeDetector = new BarcodeDetector({ 
                formats: ["qr_code", "ean_13", "code_128", "code_39"] 
            });
            
            try {
                // Menganalisis frame dari video
                const barcodes = await barcodeDetector.detect(video);
                
                if (barcodes.length > 0) {
                    const idAnggota = barcodes[0].rawValue;
                    
                    // Jika barcode berbeda dengan yang terakhir kali discan dalam 3 detik terakhir
                    if (idAnggota !== lastScanned) {
                        lastScanned = idAnggota;
                        simpanDataAbsen(idAnggota);
                        
                        // Jeda 3 detik agar tidak dobel scan ID yang sama berturut-turut
                        setTimeout(() => { lastScanned = ""; }, 3000); 
                    }
                }
            } catch (e) {
                // Abaikan error background (misal frame blur sesaat)
            }

            // Ulangi terus menerus seperti loop
            requestAnimationFrame(scanBerulang);
        }

        // --- 4. FUNGSI PENYIMPANAN & UMPAN BALIK ---
        function simpanDataAbsen(id) {
            const now = new Date();
            const timeString = now.toLocaleDateString('id-ID') + ' ' + now.toLocaleTimeString('id-ID');
            
            // Masukkan ke database memori
            attendanceData.push({ id: id, waktu: timeString });
            localStorage.setItem('absensi_anggota', JSON.stringify(attendanceData));
            
            // Getarkan HP (jika didukung) sebagai tanda berhasil
            if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
            
            updateUI();
            alert("✅ Berhasil Absen:\n" + id);
        }

        // --- 5. FUNGSI EKSPOR EXCEL (CSV) ---
        function exportToCSV() {
            if (attendanceData.length === 0) return alert("Belum ada data untuk di-download!");
            
            let csvContent = "data:text/csv;charset=utf-8,ID Anggota,Waktu Absen\n";
            attendanceData.forEach(row => {
                csvContent += `${row.id},${row.waktu}\n`;
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "Absensi_Anggota.csv");
            document.body.appendChild(link);
            link.click();
        }

        // --- 6. HAPUS DATA ---
        function clearData() {
            if(confirm("AWAS! Apakah Anda yakin ingin menghapus SEMUA riwayat absensi di HP ini? Data yang terhapus tidak bisa dikembalikan.")) {
                localStorage.removeItem('absensi_anggota');
                attendanceData = [];
                updateUI();
            }
        }

        // Tampilkan data yang sudah ada saat aplikasi pertama dibuka
        updateUI();
    </script>
</body>
</html>
